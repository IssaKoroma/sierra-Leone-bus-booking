<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SL Transport V16 CLICK FIX</title>
<style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f0f4f2} .header{background:#0a8a4b;color:#fff;padding:14px;text-align:center;font-weight:800;position:sticky;top:0} .topnav{display:flex;background:#fff;border-bottom:2px solid #0a8a4b;position:sticky;top:48px;z-index:99} .topnav button{flex:1;padding:16px;border:none;background:#fff;font-weight:800;font-size:16px;cursor:pointer} .topnav button.active{background:#0a8a4b;color:#fff} .card{background:#fff;border-radius:12px;margin:10px;padding:14px} .bus-card{border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0;display:flex;justify-content:space-between} .btn{padding:12px;border:none;border-radius:8px;font-weight:700;color:#fff;cursor:pointer} .green{background:#0a8a4b}.red{background:#d32f2f}.blue{background:#1976d2} .seat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .seat{padding:14px;text-align:center;border-radius:8px;border:2px solid #ccc;background:#eee;font-weight:700} .seat.sold{background:red;color:#fff} .seat.selected{background:#0a8a4b;color:#fff} .hidden{display:none!important} input,textarea{width:100%;padding:12px;margin:6px 0;border:2px solid #ddd;border-radius:8px}</style>
</head><body>
<div class="header">🇸🇱 SL Transport V16 - ALL BUTTONS CLICK</div>
<div class="topnav">
<button id="btnBook" class="active" onclick="openTab('book')">🎫 Book</button>
<button id="btnDriver" onclick="openTab('driver')">🚌 Driver</button>
<button id="btnAdmin" onclick="openTab('admin')">👑 Admin</button>
</div>

<div id="page-book">
<div class="card">
<button style="padding:10px;background:#0a8a4b;color:#fff;border:none;border-radius:8px;font-weight:700" onclick="setSlot('morning')">🌅 Morning</button>
<button style="padding:10px;background:#fff;border:2px solid #ddd;border-radius:8px;font-weight:700" onclick="setSlot('afternoon')">☀️ Afternoon</button>
<button style="padding:10px;background:#fff;border:2px solid #ddd;border-radius:8px;font-weight:700" onclick="setSlot('evening')">🌙 Evening</button>
<h3 id="busTitle">Morning Buses</h3><div id="busList">Loading...</div>
</div>
<div id="seatArea" class="card hidden"><h3>Select Seat</h3><div id="seatGrid" class="seat-grid"></div><div style="margin:10px 0">Seat: <b id="curSeat" style="color:red">None</b> Bus: <b id="curBus"></b> Price: <b id="curPrice"></b></div><textarea id="txn" placeholder="Paste SMS with 072039074" oninput="check()"></textarea><div id="msg"></div><input id="name" placeholder="Name"><input id="phone" placeholder="Phone"><button id="payBtn" class="btn green" style="width:100%" onclick="doPay()" disabled>Select Seat First</button></div>
<div id="pendArea" class="card hidden" style="background:#fff3cd"><h3>⏳ Pending Approval</h3><p id="pendTxt"></p><button class="btn blue" style="width:100%" onclick="checkApprove()">Check Approval</button><p id="checkMsg"></p></div>
<div id="tickArea" class="card hidden" style="text-align:center"><h2 style="color:green">✅ Approved!</h2><p id="tickTxt"></p><p id="tickId"></p></div>
</div>

<div id="page-driver" class="hidden"><div class="card"><h2>🚌 DRIVER - CLICK WORKS!</h2><p>If you see this, Driver button clicked!</p><input value="driver1"><input value="driver123"><button class="btn blue" style="width:100%" onclick="document.getElementById('driverOk').classList.remove('hidden')">LOGIN</button></div><div id="driverOk" class="card hidden"><input id="scanInput" placeholder="Paste ticket ID"><button class="btn green" style="width:100%" onclick="doScan()">Validate Ticket</button><div id="scanResult"></div></div></div>

<div id="page-admin" class="hidden"><div class="card"><h2>👑 ADMIN - CLICK WORKS!</h2><p>If you see this, Admin button clicked!</p><input id="adminPw" value="admin123"><button class="btn green" style="width:100%" onclick="adminGo()">LOGIN ADMIN</button></div><div id="adminOk" class="hidden"><div class="card"><div id="income" style="font-weight:800;color:green"></div><button class="btn red" onclick="clearAll()">CLEAR ALL DATA - RESET</button></div><div class="card"><h3>Pending Approvals</h3><div id="adminPend"></div></div></div></div>

<script>
// FORCE DEFAULT DATA - NO EMPTY BUG
var SLOT='morning';
var ROUTES=[{to:'Bo',price:45000,time:'08:30 AM',bus:'B-M1',slot:'morning'},{to:'Bo',price:45000,time:'02:00 PM',bus:'B-A1',slot:'afternoon'},{to:'Bo',price:50000,time:'06:30 PM',bus:'B-E1',slot:'evening'},{to:'Kono',price:70000,time:'07:30 AM',bus:'B-M2',slot:'morning'},{to:'Makeni',price:40000,time:'08:00 AM',bus:'B-M3',slot:'morning'},{to:'Makeni',price:40000,time:'06:00 PM',bus:'B-E3',slot:'evening'},{to:'Kenema',price:50000,time:'09:00 AM',bus:'B-M4',slot:'morning'}];
var selR=null,selS=null;

function openTab(name){
document.getElementById('page-book').classList.add('hidden');
document.getElementById('page-driver').classList.add('hidden');
document.getElementById('page-admin').classList.add('hidden');
document.getElementById('btnBook').classList.remove('active');
document.getElementById('btnDriver').classList.remove('active');
document.getElementById('btnAdmin').classList.remove('active');
if(name=='book'){document.getElementById('page-book').classList.remove('hidden');document.getElementById('btnBook').classList.add('active');loadBuses();}
if(name=='driver'){document.getElementById('page-driver').classList.remove('hidden');document.getElementById('btnDriver').classList.add('active');}
if(name=='admin'){document.getElementById('page-admin').classList.remove('hidden');document.getElementById('btnAdmin').classList.add('active');}
}
function setSlot(s){SLOT=s;document.getElementById('busTitle').textContent=s+' Buses';loadBuses();}
function loadBuses(){var all=JSON.parse(localStorage.getItem('BK16')||'[]');var today=new Date().toISOString().slice(0,10);var h='';for(var i=0;i<ROUTES.length;i++){if(ROUTES[i].slot!=SLOT)continue;var r=ROUTES[i];var cnt=0;for(var j=0;j<all.length;j++)if(all[j].bus==r.bus&&all[j].date==today&&all[j].status!='rejected')cnt++;var av=24-cnt;h+='<div class=bus-card><div><b>Freetown → '+r.to+'</b><br><small>'+r.time+' #'+r.bus+'</small><br><b style=color:green>'+r.price.toLocaleString()+' Le</b> '+av+' left</div><div><button class=btn green onclick=pick(\''+r.bus+'\') '+(av<=0?'disabled style=background:#aaa':'')+'>Select</button></div></div>';}if(!h)h='<div>No '+SLOT+' buses</div>';document.getElementById('busList').innerHTML=h;}
function pick(bus){for(var i=0;i<ROUTES.length;i++)if(ROUTES[i].bus==bus)selR=ROUTES[i];selS=null;document.getElementById('curBus').textContent=selR.bus;document.getElementById('curPrice').textContent=selR.price.toLocaleString();document.getElementById('curSeat').textContent='None';document.getElementById('seatArea').classList.remove('hidden');loadSeats();}
function loadSeats(){var all=JSON.parse(localStorage.getItem('BK16')||'[]');var today=new Date().toISOString().slice(0,10);var sold=[];for(var i=0;i<all.length;i++)if(all[i].bus==selR.bus&&all[i].date==today&&all[i].status!='rejected')sold.push(all[i].seat);var g=document.getElementById('seatGrid');g.innerHTML='';for(var i=1;i<=24;i++){var sid='A'+i;var is=sold.indexOf(sid)>=0;var d=document.createElement('div');d.className='seat'+(is?' sold':'');d.textContent=sid;if(!is){d.onclick=(function(s){return function(){var a=document.querySelectorAll('.seat');for(var k=0;k<a.length;k++)a[k].classList.remove('selected');this.classList.add('selected');selS=s;document.getElementById('curSeat').textContent=s;document.getElementById('curSeat').style.color='green';check();}})(sid);}g.appendChild(d);}}
function check(){var t=document.getElementById('txn').value;var m=document.getElementById('msg');var b=document.getElementById('payBtn');if(!selS){b.disabled=true;b.textContent='Select Seat';return;}if(t.indexOf('072039074')<0){m.textContent='Need 072039074';m.style.color='red';b.disabled=true;return;}m.textContent='OK';m.style.color='green';b.disabled=false;b.textContent='Pay '+selR.price.toLocaleString()+' Le';}
function doPay(){var n=document.getElementById('name').value;var p=document.getElementById('phone').value;var tx=document.getElementById('txn').value;if(!n||!p||!tx){alert('Fill all');return;}var id='TKT'+Date.now().toString().slice(-6);var today=new Date().toISOString().slice(0,10);var rec={id:id,to:selR.to,bus:selR.bus,slot:selR.slot,seat:selS,price:selR.price,name:n,date:today,status:'pending',txn:tx.slice(0,30)};var all=JSON.parse(localStorage.getItem('BK16')||'[]');all.push(rec);localStorage.setItem('BK16',JSON.stringify(all));localStorage.setItem('PEND16',id);document.getElementById('seatArea').classList.add('hidden');document.getElementById('pendArea').classList.remove('hidden');document.getElementById('pendTxt').textContent=id;}
function checkApprove(){var pid=localStorage.getItem('PEND16');var all=JSON.parse(localStorage.getItem('BK16')||'[]');var f=null;for(var i=0;i<all.length;i++)if(all[i].id==pid)f=all[i];var m=document.getElementById('checkMsg');if(!f){m.textContent='No booking';return;}if(f.status=='pending'){m.textContent='⏳ Still pending - Admin not approved';m.style.color='orange';return;}if(f.status=='approved'){document.getElementById('pendArea').classList.add('hidden');document.getElementById('tickArea').classList.remove('hidden');document.getElementById('tickTxt').textContent=f.to+' Seat '+f.seat+' Bus '+f.bus+' '+f.slot;document.getElementById('tickId').textContent=f.id;}}
function doScan(){var v=document.getElementById('scanInput').value;var all=JSON.parse(localStorage.getItem('BK16')||'[]');var f=null;for(var i=0;i<all.length;i++)if(v.indexOf(all[i].id)>=0)f=all[i];var r=document.getElementById('scanResult');if(!f){r.innerHTML='<div style=background:red;color:#fff;padding:15px>❌ FAKE</div>';return;}if(f.status!='approved'){r.innerHTML='<div style=background:orange;color:#fff;padding:15px>⏳ Not approved</div>';return;}r.innerHTML='<div style=background:green;color:#fff;padding:20px>✅ VALID GREEN<br>'+f.name+' Seat '+f.seat+' '+f.slot+' '+f.date+'</div>';}
function adminGo(){document.getElementById('adminOk').classList.remove('hidden');loadAdmin();}
function loadAdmin(){var all=JSON.parse(localStorage.getItem('BK16')||'[]');var h='';var inc=0;for(var i=0;i<all.length;i++){if(all[i].status=='approved')inc+=all[i].price;if(all[i].status=='pending')h+='<div style=border:1px solid orange;padding:10px;margin:5px 0;border-radius:8px><b>'+all[i].id+'</b> '+all[i].name+' →'+all[i].to+' Seat '+all[i].seat+' '+all[i].slot+'<br>Txn:'+all[i].txn+'<br><button class=btn green onclick=approve(\''+all[i].id+'\')>Approve</button> <button class=btn red onclick=reject(\''+all[i].id+'\')>Reject</button></div>';}document.getElementById('adminPend').innerHTML=h||'No pending';document.getElementById('income').textContent='Income '+inc.toLocaleString()+' Le';}
function approve(id){var all=JSON.parse(localStorage.getItem('BK16')||'[]');for(var i=0;i<all.length;i++)if(all[i].id==id)all[i].status='approved';localStorage.setItem('BK16',JSON.stringify(all));loadAdmin();alert('Approved');}
function reject(id){var all=JSON.parse(localStorage.getItem('BK16')||'[]');for(var i=0;i<all.length;i++)if(all[i].id==id)all[i].status='rejected';localStorage.setItem('BK16',JSON.stringify(all));loadAdmin();}
function clearAll(){if(confirm('Clear all bookings?')){localStorage.clear();location.reload();}}
loadBuses();
</script></body></html>
